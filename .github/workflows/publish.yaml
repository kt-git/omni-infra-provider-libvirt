# kt-git fork: build and publish the provider image to GHCR.
name: publish
on:
  push:
    branches:
      - bridge-networking
    tags:
      - "v*"
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      USERNAME: ${{ github.repository_owner }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/omni-infra-provider-libvirt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: unit tests
        run: go vet ./... && go test ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push image (sha tag)
        run: |
          SHA_TAG="sha-$(git rev-parse --short=8 HEAD)"
          echo "SHA_TAG=${SHA_TAG}" >> "$GITHUB_ENV"
          make image-omni-infra-provider-libvirt PUSH=true PLATFORM=linux/amd64 \
            REGISTRY="${REGISTRY}" USERNAME="${USERNAME}" IMAGE_TAG="${SHA_TAG}"
      - name: add ref tag
        run: |
          REF_TAG="${GITHUB_REF_NAME//\//-}"
          docker buildx imagetools create -t "${IMAGE}:${REF_TAG}" "${IMAGE}:${SHA_TAG}"
          docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}"
